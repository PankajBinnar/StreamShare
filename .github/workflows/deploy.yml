name: StreamShare Continuous Deployment (CD)

on:
  push:
    branches: [main, master]

jobs:
  db-migration:
    name: Run Production Database Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd server
          npm install

      - name: Deploy Prisma Migrations to PostgreSQL
        if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        run: |
          cd server
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Skip Migration Notice (If Secret Not Set Yet)
        if: ${{ secrets.PRODUCTION_DATABASE_URL == '' }}
        run: |
          echo "ℹ️ PRODUCTION_DATABASE_URL is not yet configured in GitHub Secrets."
          echo "Automated database migration skipped. Add PRODUCTION_DATABASE_URL in repo Settings -> Secrets to enable automatic schema migrations."

  deploy:
    name: Deploy to Production
    needs: [db-migration]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Production Deployment Webhook
        if: ${{ secrets.DEPLOY_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK }}"

      - name: Log Deployment Status
        run: |
          echo "🚀 StreamShare Continuous Deployment completed successfully!"
