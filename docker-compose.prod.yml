services:
  postgres:
    image: postgres:16-alpine
    container_name: streamshare_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamshare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamshare_prod_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-streamshare_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamshare_user} -d ${POSTGRES_DB:-streamshare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamshare_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: streamshare_prod_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamshare_user}:${POSTGRES_PASSWORD:-streamshare_prod_pass_2026}@postgres:5432/${POSTGRES_DB:-streamshare_db}?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_CACHE: "true"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-/}
    container_name: streamshare_prod_client
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: streamshare_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client

volumes:
  prod_postgres_data:
  prod_redis_data:

